name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        working-directory: school-management-system
        run: |
          DEBUG=True SECRET_KEY=ci-secret-key python manage.py check --deploy || true
          DEBUG=True SECRET_KEY=ci-secret-key python manage.py check

      - name: Validate static files collection
        working-directory: school-management-system
        run: |
          DEBUG=True SECRET_KEY=ci-secret-key python manage.py collectstatic --noinput
