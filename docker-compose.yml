version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "changeme"
      DEBUG: "1"
      DATABASE_URL: "postgresql://bjsuser:bjspassword@db:5432/bjsdb"
      DB_SSL_REQUIRE: "False"
      ALLOW_SQLITE_IN_PRODUCTION: "False"
      PORT: "8000"
    volumes:
      - .:/app
    working_dir: /app/school-management-system
    command: sh deploy-start.sh
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bjsdb
      POSTGRES_USER: bjsuser
      POSTGRES_PASSWORD: bjspassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bjsuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
