<html>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <h2 style="margin-bottom: 8px;">Bitende Junior School Fee Reminder</h2>
  <p style="margin-top: 0;">Student: <strong>{{ student.first_name }} {{ student.last_name }}</strong> ({{ student.student_id }})</p>
  <p style="margin: 0 0 10px 0;">Term {{ term_number }} / {{ academic_year }}</p>
  <p style="margin: 0 0 10px 0;">{{ title }}</p>
  <p style="margin: 0 0 10px 0;">Amount due or promised: <strong>UGX {{ amount }}</strong></p>
  <p style="margin: 0 0 16px 0;">Due date: <strong>{{ due_date }}</strong></p>
  <p style="margin: 0 0 16px 0;">{{ message_text }}</p>
  <p style="margin: 0;">Thank you.</p>
</body>
</html>
