<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Card</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222;">
  <p>Dear Parent/Guardian,</p>
  <p>Please find attached the report card for <strong>{{ student_name }}</strong>.</p>
  <ul>
    <li>Class: {{ class_level }}</li>
    <li>Overall Average: {{ overall_average }}%</li>
    <li>Class Position: {{ class_position }}</li>
    <li>Next Term Start: {{ next_term_start_date }}</li>
  </ul>
  <p>Regards,<br>Bitende Junior School</p>
</body>
</html>
